<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="소방설비기사(전기분야) 필기 및 실기 독립 문제은행. 답을 선택하고 바로 정답과 해설을 확인하며 공부할 수 있습니다.">
  <meta name="keywords" content="소방설비기사, 전기분야, 소방원론, 소방전기회로, 소방관계법규, 소방전기시설의 구조 및 원리, 기출문제, 문제은행, 기출문제집, CBT">
  <meta property="og:title" content="소방설비기사 문제풀이">
  <meta property="og:description" content="소방설비기사(전기분야) 독립 문제은행. 답을 선택하고 바로 정답과 해설을 확인하세요.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rucachi.github.io/fire_study/">
  <meta name="robots" content="index, follow">
  <title>소방설비기사 문제풀이</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">FIRE SAFETY STUDY</p>
        <h1>소방설비기사 문제풀이</h1>
        <p class="subtitle">답을 선택하고 바로 정답과 해설을 확인하세요.</p>
      </div>
      <div class="header-actions">
        <button id="home-button" class="home-button" type="button" title="처음 화면으로">🏠 처음 화면</button>
        <button id="reset-progress" class="text-button" type="button">기록 초기화</button>
      </div>
    </header>

    <section id="setup-view" class="panel">
      <h2>과목 선택</h2>
      <div id="subject-list" class="subject-grid" aria-label="과목 목록"></div>
      <div class="setup-actions">
        <label class="select-label" for="question-count">출제 문항 수</label>
        <select id="question-count">
          <option value="10">10문항</option>
          <option value="20" selected>20문항</option>
          <option value="50">50문항</option>
          <option value="all">전체 문항</option>
        </select>
        <button id="start-button" class="primary-button" type="button" disabled>문제 풀기 시작</button>
      </div>
    </section>

    <section id="quiz-view" class="panel hidden" aria-live="polite">
      <div class="quiz-toolbar">
        <button id="back-button" class="text-button" type="button">⌂ 처음 화면</button>
        <span id="progress-label"></span>
        <span id="score-label"></span>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
      <article class="question-card">
        <div class="question-meta">
          <span id="question-category" class="badge"></span>
          <span id="question-id"></span>
        </div>
        <h2 id="question-text"></h2>
        <div id="options" class="options" role="radiogroup" aria-label="답안"></div>
        <div id="feedback" class="feedback hidden"></div>
        <div class="question-actions">
          <button id="submit-button" class="primary-button" type="button" disabled>정답 확인</button>
          <button id="next-button" class="secondary-button hidden" type="button">다음 문제 →</button>
        </div>
      </article>
      
      <a href="https://blog.naver.com/anova99" target="_blank" rel="noopener noreferrer" class="promo-banner">
        <span class="promo-icon">📝</span>
        <div class="promo-text">
          <strong>소방설비기사 합격 비법 & 핵심 요약정리!</strong>
          <span>제작자 블로그에서 더 많은 자료를 확인하세요 👉</span>
        </div>
      </a>
    </section>

    <section id="result-view" class="panel hidden">
      <div class="result-icon">✓</div>
      <h2>학습 완료</h2>
      <p id="result-summary"></p>
      <div id="result-breakdown" class="result-breakdown"></div>
      <div class="result-actions">
        <button id="retry-button" class="primary-button" type="button">같은 조건으로 다시 풀기</button>
        <button id="result-home-button" class="secondary-button" type="button">⌂ 처음 화면으로</button>
      </div>

      <a href="https://blog.naver.com/anova99" target="_blank" rel="noopener noreferrer" class="promo-banner result-promo">
        <span class="promo-icon">🔥</span>
        <div class="promo-text">
          <strong>합격을 축하드립니다! (합격 기원)</strong>
          <span>수험 기간을 줄여주는 블로그 꿀팁 보러가기 👉</span>
        </div>
      </a>
    </section>

    <footer>
      <p>학습용 문제은행입니다. 법령·화재안전기준은 최신 원문을 확인하세요.</p>
      <p>제작자 블로그: <a href="https://blog.naver.com/anova99" target="_blank" rel="noopener noreferrer">https://blog.naver.com/anova99</a></p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
